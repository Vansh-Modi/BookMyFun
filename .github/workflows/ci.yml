name: Run Tests on GitHub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Password@12345!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password@12345!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=15s

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore

    - name: Run All Tests
      run: dotnet test --no-build --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Password@12345!;TrustServerCertificate=True;"
        TEST_CONNECTION_STRING: "Server=127.0.0.1,1433;Database=master;User Id=sa;Password=Password@12345!;TrustServerCertificate=True;"
